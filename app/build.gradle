plugins { id 'com.android.application' }

def requestedVersionCode = providers.gradleProperty('appVersionCode').orElse('3').get().toInteger()
android {
 namespace 'com.shaterguy.slidingpuzzle'
 compileSdk 35
 defaultConfig {
  applicationId 'com.shaterguy.slidingpuzzle'
  minSdk 26
  targetSdk 35
  versionCode requestedVersionCode
  versionName '0.2.0'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 flavorDimensions += 'channel'
 productFlavors {
  dev { dimension 'channel'; applicationIdSuffix '.dev'; versionNameSuffix '-dev2'; resValue 'string', 'app_name', '슬라이딩 퍼즐 DEV' }
  production { dimension 'channel'; resValue 'string', 'app_name', '슬라이딩 퍼즐' }
 }
 signingConfigs {
  debug {
   if (System.getenv('DEV_KEYSTORE_PATH')) {
    storeFile file(System.getenv('DEV_KEYSTORE_PATH'))
    storePassword System.getenv('DEV_KEYSTORE_PASSWORD')
    keyAlias System.getenv('DEV_KEY_ALIAS')
    keyPassword System.getenv('DEV_KEY_PASSWORD')
   }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { animationsDisabled = true }
}
dependencies {
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
 androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
}
