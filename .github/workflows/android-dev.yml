name: Android persistent DEV APK
on:
  push:
    branches: ['v0.2.0-dev*']
permissions:
  contents: read
concurrency:
  group: sliding-puzzle-dev-${{ github.ref }}
  cancel-in-progress: false
env:
  DEV_VERSION: 0.2.0-dev2
  DEV_VERSION_CODE: '3'
  DEV_PACKAGE: com.shaterguy.slidingpuzzle.dev
  DEV_APK: Sliding-Puzzle-0.2.0-dev2.apk
  KEYSTORE_FILE: sliding-puzzle-dev.keystore
jobs:
  package-and-update-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Persistent signer preflight
        env:
          KEYSTORE_B64: ${{ secrets.SP_DEV_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo '::error::SP_DEV_KEYSTORE_BASE64 is missing.'
            exit 1
          fi
          keyfile="$RUNNER_TEMP/$KEYSTORE_FILE"
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"; then
            echo '::error::SP_DEV_KEYSTORE_BASE64 is not valid Base64. Recreate the secret from the raw keystore bytes.'
            exit 1
          fi
          chmod 600 "$keyfile"
          bytes=$(wc -c < "$keyfile")
          if [ "$bytes" -lt 500 ]; then
            echo "::error::Decoded keystore is unexpectedly small (${bytes} bytes). The secret likely contains the wrong value."
            exit 1
          fi
          if ! keytool -list -keystore "$keyfile" -storepass android >/dev/null 2>&1; then
            echo '::error::Decoded keystore cannot be opened with store password android. Recreate the keystore with the provided command or replace the secret with the matching keystore.'
            exit 1
          fi
          if ! keytool -list -keystore "$keyfile" -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo '::error::Keystore opens, but alias androiddebugkey is missing. Recreate it with alias androiddebugkey or replace the secret.'
            exit 1
          fi
          echo "Persistent signer preflight PASS (${bytes} decoded bytes; alias verified)."
      - name: Build current and lower-version update fixture
        env:
          DEV_KEYSTORE_PATH: ${{ runner.temp }}/sliding-puzzle-dev.keystore
          DEV_KEYSTORE_PASSWORD: android
          DEV_KEY_ALIAS: androiddebugkey
          DEV_KEY_PASSWORD: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging delivery runtime-evidence
          gradle --no-daemon :app:assembleDevDebug
          cp app/build/outputs/apk/dev/debug/app-dev-debug.apk staging/current.apk
          gradle --no-daemon :app:assembleDevDebug -PappVersionCode=2
          cp app/build/outputs/apk/dev/debug/app-dev-debug.apk staging/baseline.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs staging/current.apk > delivery/signature.txt
          "$tools/apksigner" verify --verbose --print-certs staging/baseline.apk > staging/baseline-signature.txt
          current_cert=$(grep -F 'Signer #1 certificate SHA-256 digest:' delivery/signature.txt | head -1 | sed 's/.*: //')
          baseline_cert=$(grep -F 'Signer #1 certificate SHA-256 digest:' staging/baseline-signature.txt | head -1 | sed 's/.*: //')
          test -n "$current_cert"
          test "$current_cert" = "$baseline_cert"
          "$tools/aapt" dump badging staging/current.apk > delivery/package.txt
          grep -F "package: name='$DEV_PACKAGE'" delivery/package.txt
          grep -F "versionCode='$DEV_VERSION_CODE'" delivery/package.txt
          grep -F "versionName='$DEV_VERSION'" delivery/package.txt
          cp staging/current.apk "delivery/$DEV_APK"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: In-place update and data preservation verification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install staging/baseline.apk | tee runtime-evidence/install-baseline.txt
            adb shell dumpsys package "$DEV_PACKAGE" | grep -F 'versionCode=2' | tee runtime-evidence/baseline-version.txt
            adb shell am start -W -n "$DEV_PACKAGE/com.shaterguy.slidingpuzzle.MainActivity" | tee runtime-evidence/baseline-launch.txt
            adb shell run-as "$DEV_PACKAGE" mkdir files || true
            adb shell run-as "$DEV_PACKAGE" touch files/update-lineage.txt
            adb install -r staging/current.apk | tee runtime-evidence/update-install.txt
            adb shell dumpsys package "$DEV_PACKAGE" | grep -F "versionCode=$DEV_VERSION_CODE" | tee runtime-evidence/current-version.txt
            adb shell run-as "$DEV_PACKAGE" ls files/update-lineage.txt | grep -F 'update-lineage.txt' | tee runtime-evidence/data-preserved.txt
            adb shell am start -W -n "$DEV_PACKAGE/com.shaterguy.slidingpuzzle.MainActivity" | tee runtime-evidence/current-launch.txt
            sleep 1
            adb exec-out screencap -p > runtime-evidence/home.png
            printf 'package=%s\nbaseline_version_code=2\ncurrent_version_code=%s\nsame_signer=PASS\nin_place_update=PASS\ndata_preserved=PASS\n' "$DEV_PACKAGE" "$DEV_VERSION_CODE" > runtime-evidence/UPDATE_TEST.txt
      - name: Lock canonical APK identity
        shell: bash
        run: |
          set -euo pipefail
          cp runtime-evidence/home.png delivery/home.png
          cp runtime-evidence/UPDATE_TEST.txt delivery/UPDATE_TEST.txt
          cert=$(grep -F 'Signer #1 certificate SHA-256 digest:' delivery/signature.txt | head -1 | sed 's/.*: //')
          cd delivery
          sha256sum "$DEV_APK" > SHA256SUMS
          printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\nchannel=DEV\nversion=%s\nversion_code=%s\npackage=%s\nsigner_cert_sha256=%s\nupdate_test=PASS\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$DEV_VERSION" "$DEV_VERSION_CODE" "$DEV_PACKAGE" "$cert" > BUILD_IDENTITY.txt
      - name: Canonical verified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: package-and-update-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery
      - name: Publish exact verified APK and signer lineage
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          cd delivery
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import os, pathlib, json, base64, hashlib, urllib.request, urllib.error
          repo=os.environ['REPOSITORY'];source=os.environ['SOURCE_SHA'];run=os.environ['RUN_ID'];attempt=os.environ['RUN_ATTEMPT']
          version=os.environ['DEV_VERSION'];apk=os.environ['DEV_APK'];branch='delivery/dev-lineage';api='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def call(method,path,data=None):
              body=None if data is None else json.dumps(data).encode();req=urllib.request.Request(api+path,data=body,method=method,headers=headers)
              with urllib.request.urlopen(req) as response:return json.load(response)
          def get_content(path):
              try:return call('GET','/contents/'+path+'?ref='+branch)
              except urllib.error.HTTPError as e:
                  if e.code==404:return None
                  raise
          try: call('GET','/git/ref/heads/'+branch)
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
              call('POST','/git/refs',{'ref':'refs/heads/'+branch,'sha':source})
          identity={}
          for line in pathlib.Path('BUILD_IDENTITY.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1);identity[k]=v
          cert=identity['signer_cert_sha256'].strip();lineage='lineage/SIGNER_CERT_SHA256.txt';existing=get_content(lineage)
          if existing:
              prior=base64.b64decode(existing['content']).decode().strip()
              if prior!=cert: raise RuntimeError('DEV signing certificate changed; refusing non-updateable APK')
          else:
              call('PUT','/contents/'+lineage,{'message':'Lock DEV signing certificate lineage','branch':branch,'content':base64.b64encode((cert+'\n').encode()).decode()})
          prefix='dist/'+version+'/'+source+'/'+run+'-'+attempt+'/'
          for name in [apk,'SHA256SUMS','BUILD_IDENTITY.txt','signature.txt','package.txt','UPDATE_TEST.txt','home.png']:
              path=prefix+name;raw=pathlib.Path(name).read_bytes();blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+bytes([0])+raw).hexdigest();existing=get_content(path)
              if existing:
                  if existing['sha']!=blob: raise RuntimeError('Immutable delivery path mismatch: '+path)
              else:
                  call('PUT','/contents/'+path,{'message':'Deliver verified '+version+' artifact','branch':branch,'content':base64.b64encode(raw).decode()})
          print('Direct APK: https://github.com/'+repo+'/raw/refs/heads/'+branch+'/'+prefix+apk)
          PY
